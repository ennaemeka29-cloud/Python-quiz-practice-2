let answered = 0, correct = 0, wrong = 0;
const userAnswers = {};

function buildQuiz() {
  const container = document.getElementById("questions-container");
  let qCounter = 0;

  SECTIONS.forEach(function(section) {
    const label = document.createElement("div");
    label.className = "section-label";
    label.style.borderBottomColor = section.color + "55";
    label.style.color = section.color;
    label.textContent = section.label;
    container.appendChild(label);

    section.qs.forEach(function(q) {
      qCounter++;
      const qId = qCounter;

      const block = document.createElement("div");
      block.className = "q-block";
      block.id = "q" + qId;
      block.innerHTML =
        '<div class="q-num">Question ' + qId + '</div>' +
        '<div class="q-text">' + q.q + '</div>' +
        '<div class="opts" id="opts' + qId + '"></div>' +
        '<div class="feedback" id="fb' + qId + '"></div>';
      container.appendChild(block);

      const optsEl = document.getElementById("opts" + qId);
      const feedback = document.getElementById("fb" + qId);
      const letters = ["A","B","C","D"];

      q.opts.forEach(function(opt, oi) {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerHTML = '<span class="opt-letter">' + letters[oi] + '</span><span>' + opt + '</span>';
        btn.addEventListener("click", function() {
          handleAnswer(qId, oi, q.ans, block, optsEl, feedback);
        });
        optsEl.appendChild(btn);
      });
    });
  });
}

function handleAnswer(qId, chosen, correctIdx, block, optsEl, feedback) {
  if (userAnswers[qId] !== undefined) return;
  userAnswers[qId] = chosen;

  var btns = optsEl.querySelectorAll(".opt-btn");
  btns.forEach(function(b) { b.disabled = true; });

  var isCorrect = chosen === correctIdx;
  btns[chosen].classList.add(isCorrect ? "correct" : "wrong");
  if (!isCorrect) btns[correctIdx].classList.add("reveal-correct");

  feedback.classList.add("show");
  if (isCorrect) {
    feedback.classList.add("ok");
    feedback.textContent = "✓  Correct!";
    correct++;
    document.getElementById("s-cor").textContent = correct;
  } else {
    feedback.classList.add("no");
    feedback.textContent = "✗  Wrong — correct answer: " + ["A","B","C","D"][correctIdx];
    wrong++;
    document.getElementById("s-wrg").textContent = wrong;
  }

  block.classList.add("answered");
  answered++;
  document.getElementById("s-ans").textContent = answered;
  document.getElementById("s-pct").textContent = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById("progress-fill").style.width = Math.round((answered / 80) * 100) + "%";
}

document.getElementById("submit-btn").addEventListener("click", function() {
  var pct = Math.round((correct / 80) * 100);
  var title = pct >= 85 ? "Excellent work! 🎉" :
              pct >= 70 ? "Good job! 👍" :
              pct >= 55 ? "Getting there — keep practising." :
                          "Needs more revision — go back through the lesson plan.";

  document.getElementById("res-title").textContent = title;
  document.getElementById("res-score").textContent = correct + " / 80";
  document.getElementById("res-pct").textContent = pct + "%  —  " + answered + " of 80 questions answered";

  var bd = document.getElementById("res-breakdown");
  bd.innerHTML = "";
  var qNum = 0;
  SECTIONS.forEach(function(section) {
    var sc = 0;
    section.qs.forEach(function(q) {
      qNum++;
      if (userAnswers[qNum] === q.ans) sc++;
    });
    var name = section.label.split(" — ")[1];
    var pill = document.createElement("div");
    pill.className = "bk-pill " + (sc / section.qs.length >= 0.6 ? "g" : "b");
    pill.textContent = name + ": " + sc + "/" + section.qs.length;
    bd.appendChild(pill);
  });

  var rb = document.getElementById("result-box");
  rb.style.display = "block";
  rb.scrollIntoView({ behavior: "smooth" });
});

buildQuiz();
</script>
